[project]
name = "kgs-bot-debug"
version = "0.1.0"
description = "E2E testing for kgs-bot and kgs-bot-monitor"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--timeout=60",
]
log_cli = true
log_cli_level = "INFO"

[tool.pytest]
asyncio_mode = "auto"